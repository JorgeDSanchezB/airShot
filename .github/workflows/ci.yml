name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./e2e.db
      AIRSHOT_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Instalar dependencias (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Instalar FFmpeg (golden path de ensamblaje)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests unitarios + integración
        run: bun run test

      - name: Build de producción
        run: bun run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./e2e.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Preparar base de datos (migraciones)
        run: bunx prisma migrate deploy

      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke E2E
        run: bun run test:e2e
